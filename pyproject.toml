[project]
name = "wine-quality"
version = "0.1.0"
description = "ML platform predicting red wine quality from physicochemical properties (Cortez et al., 2009)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DeepseekV4.1" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "plotly>=5.24",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[project.scripts]
wine-train = "wine_quality.models.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wine_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=wine_quality --cov-report=term-missing"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: end-to-end tests that cross-validate every candidate pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages use `dict(...)` for Plotly layout kwargs, which reads better
# than a literal for that API. E402 is needed because `sys.path` is patched
# before the project imports.
"app/*" = ["E402", "C408"]
"app/pages/*" = ["E402", "C408"]
"tests/*" = ["S101"]