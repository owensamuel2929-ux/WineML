# Reverse proxy for single-port deployments (Hugging Face Spaces).
#
# Spaces publishes exactly one port externally, so both services are multiplexed
# behind nginx on port 7860:
#
#   /       -> Streamlit dashboard
#   /api/   -> FastAPI, including the interactive docs at /api/docs
#
# The dashboard itself does NOT go through this proxy when calling the API: it
# uses bare loopback (127.0.0.1:8000) because the /api prefix is a property of
# the browser's view, not of the internal service address.
#
# An `upstream` block with a hostname rather than a proxy_pass URL is used so
# nginx resolves the name once at startup instead of per request, which avoids a
# resolver lookup on every call.

worker_processes auto;

# nginx's default pid path is /run/nginx.pid, which the unprivileged Space user
# cannot write to. Point it at a directory the image chowns to that user.
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths default under /var/lib/nginx, which is also root-owned on a
    # stock install. Keep everything writable in one place.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Space logs are the only debugging surface, so keep them informative.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 75s;

    # Model responses are small; the default cap is generous already, but being
    # explicit avoids surprises if a batch endpoint is added later.
    client_max_body_size 8m;

    # WebSocket upgrade handling. Streamlit's live-update channel is a
    # WebSocket, and without these headers the UI renders its initial HTML then
    # hangs on "Connecting...".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    upstream dashboard_backend {
        server 127.0.0.1:7861;
        keepalive 16;
    }

    server {
        listen 7860;
        server_name _;

        # -- API ----------------------------------------------------------
        # Trailing slash on both sides strips the /api prefix, so FastAPI sees
        # its normal paths (/health, /predict) and its generated OpenAPI
        # document references the correct public URLs via --root-path.
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
        }

        # Redirect bare /api so the docs link is forgiving.
        location = /api {
            return 302 /api/docs;
        }

        # -- Dashboard ----------------------------------------------------
        location / {
            proxy_pass http://dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Streamlit holds long-lived connections; the default 60s would
            # sever them mid-session.
            proxy_read_timeout  7d;
            proxy_send_timeout  7d;
            proxy_buffering     off;
        }
    }
}